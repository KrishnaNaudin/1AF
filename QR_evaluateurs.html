<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Evaluator QR codes — AgroecologIA Rwanda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;margin:18px;color:#06292B}
h1{font-size:18px;color:#005E29}
.bar{margin:10px 0;font-size:13px}.bar input{font:inherit;width:60%;padding:6px;border:1px solid #94C11E;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.c{border:2px solid #94C11E;border-radius:12px;padding:10px;text-align:center;break-inside:avoid}
.n{font-weight:700;font-size:15px;margin-bottom:6px}
.u{font-size:9px;color:#5b6b67;word-break:break-all;margin-top:6px}
@media print{.bar,p.hint{display:none}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<h1>AgroecologIA workshop — One Acre Fund Rwanda · evaluator QR codes</h1>
<div class="bar">Published site URL (without <code>?ev=</code>):
<input id="base" value="https://krishnanaudin.github.io/1AF/" oninput="render()"></div>
<p class="hint" style="font-size:12px">Each evaluator scans his/her own QR → the form opens with the right plan. Edit the URL above, then print (Ctrl+P).</p>
<div class="grid" id="grid"></div>
<script>
function render(){
  var base=document.getElementById('base').value.replace(/\/?$/,'/');
  var g=document.getElementById('grid'); g.innerHTML='';
  for(var i=1;i<=45;i++){var n=(i<10?'0':'')+i; var url=base+'?ev='+n;
    var d=document.createElement('div'); d.className='c';
    d.innerHTML='<div class="n">Evaluator '+n+'</div><div id="q'+n+'"></div><div class="u">'+url+'</div>';
    g.appendChild(d);
    new QRCode(document.getElementById('q'+n),{text:url,width:150,height:150});
  }
}
render();
</script></body></html>
